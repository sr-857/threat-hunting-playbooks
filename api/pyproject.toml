[project]
name = "threat-hunting-api"
version = "0.1.0"
description = "FastAPI backend for Threat Hunting Playbooks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.12",
    "pyyaml>=6.0",
    "pysigma>=0.10.9",
    "sigma-cli>=0.9.0",
    "yara-python>=4.3.0",
    "orjson>=3.9.10",
    "httpx>=0.26.0",
    "prometheus-fastapi-instrumentator>=5.10.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "croniter>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0"
]

connectors = [
    "elasticsearch>=8.12.0",
    "azure-identity>=1.15.0",
    "azure-monitor-query>=1.2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
