title: SaaS Credential Stuffing Campaign
id: b5c8b8f2-5f22-4a2e-8d7d-2ab1cba3f89d
status: experimental
description: Detects rapid login failures across multiple IPs followed by success for the same user within a short window.
author: Threat Hunting Playbooks Team
logsource:
  product: saas
  service: identity
  category: authentication
detection:
  selection_failures:
    outcome: failure
  selection_success:
    outcome: success
  timeframe: 5m
  condition: selection_failures | count(>=5) by user | near selection_success by user within 5m
fields:
  - timestamp
  - user
  - sourceIpAddress
  - userAgent
  - outcome
  - mfaResult
falsepositives:
  - Legitimate password reset campaigns or load testing
level: high
