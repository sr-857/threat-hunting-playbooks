version: "3.9"

services:
  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
      - ./samples:/samples
      - ./rules:/rules
      - ./config:/config
      - ./logs:/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://threat_user:threat_pass@db:5432/threat_playbooks
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - SAMPLES_ROOT=/samples
      - RULES_ROOT=/rules
      - CONFIG_ROOT=/config
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - WORKER_METRICS_PORT=9002
    depends_on:
      - db
      - minio
      - redis
    ports:
      - "8000:8000"

  ui:
    build: ./ui
    command: npm run dev
    volumes:
      - ./ui:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: threat_pass
      POSTGRES_DB: threat_playbooks
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: ./api
    command: celery -A app.scheduler.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./api:/app
      - ./samples:/samples
      - ./rules:/rules
      - ./config:/config
      - ./logs:/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://threat_user:threat_pass@db:5432/threat_playbooks
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - SAMPLES_ROOT=/samples
      - RULES_ROOT=/rules
      - CONFIG_ROOT=/config
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
      - minio

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:10.4.6
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - prometheus

volumes:
  pgdata:
  minio_data:
