title: Suspicious PowerShell Use
id: 11111111-1111-1111-1111-111111111111
status: experimental
description: Detects PowerShell invocations with encoded command parameters.
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.tactic:execution
  - attack.technique:T1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: powershell.exe
    CommandLine|contains: "-enc"
  condition: selection
falsepositives:
  - Legitimate administrative scripts using encoded commands.
level: high
