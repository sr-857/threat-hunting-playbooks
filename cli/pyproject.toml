[project]
name = "threat-cli"
version = "0.1.0"
description = "CLI client for Threat Hunting Playbooks"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "httpx>=0.26.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[project.scripts]
threat-cli = "threat_cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
